[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"   # solc 0.8.28 targets up to cancun; Arc runs Osaka, which is a superset
optimizer = true
optimizer_runs = 200
fs_permissions = []
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
fail_on_revert = true
runs = 128
depth = 64
