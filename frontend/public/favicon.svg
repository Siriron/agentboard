<svg width="64" height="64" viewBox="0 0 64 64" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>AgentBoard</title>
  <desc>AgentBoard — orbiting agent node mark, purple to pink gradient</desc>

  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#logoGrad)"/>

  <!-- Agent node: orbiting satellite around a core, matching the in-app header mark -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-opacity="0.92"/>
  <circle cx="32" cy="20" r="4.6" fill="#ffffff"/>
</svg>
